<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>SARO Lab — Open source</title>
  <!-- 소셜 카드. 플라스크 원본과 청록·앰버 색을 공유한다.
       텍스트가 실제 폰트라 resvg가 시스템 폰트를 로드해야 한다. -->
  <defs>
    <radialGradient id="w1"><stop offset="0" stop-color="#0d989c" stop-opacity="0.30"/><stop offset="1" stop-color="#0d989c" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#1bafa5" stop-opacity="0.22"/><stop offset="1" stop-color="#1bafa5" stop-opacity="0"/></radialGradient>
    <radialGradient id="w3"><stop offset="0" stop-color="#f3ae32" stop-opacity="0.14"/><stop offset="1" stop-color="#f3ae32" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0a14"/>
  <circle cx="180" cy="110" r="440" fill="url(#w1)"/>
  <circle cx="1080" cy="560" r="440" fill="url(#w2)"/>
  <circle cx="860" cy="80" r="360" fill="url(#w3)"/>

  <image href="mark.svg" x="88" y="176" width="180" height="180"/>

  <text x="292" y="286" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#ffffff">SARO Lab</text>
  <rect x="294" y="322" width="112" height="5" rx="2.5" fill="#24b9ae"/>
  <text x="292" y="392" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" fill="#d6e8e8">An Open Source Project Space for Developers</text>
  <text x="292" y="440" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" fill="#94aab4">From security systems to web tools—feel free to join and explore.</text>
</svg>
